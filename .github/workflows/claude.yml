name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout EC-CUBE documentation
        uses: actions/checkout@v4
        with:
          repository: EC-CUBE/doc4.ec-cube.net
          path: doc4.ec-cube.net
          fetch-depth: 1

      - name: Install PHP dependencies
        uses: php-actions/composer@v6
        with:
          php_extensions: intl zip
          args: --no-dev --prefer-dist --no-interaction

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # 日本語で回答し、Issue/PRコメントで回答するように設定
          prompt: |
            日本語で回答してください。

            ## 対応するIssue
            - リポジトリ: ${{ github.repository }}
            - Issue番号: #${{ github.event.issue.number }}
            - タイトル: ${{ github.event.issue.title }}
            - 質問内容:
            ${{ github.event.issue.body }}

            上記の質問に対して、`gh issue comment ${{ github.event.issue.number }} --body "回答内容"` コマンドを使用してIssueにコメントで回答してください。

            ## 情報ソース
            回答の際は、以下の情報ソースを参照してください：

            1. **このリポジトリのソースコード** - `src/Eccube/` 以下の実装を確認
            2. **依存パッケージのソースコード** - `vendor/` 以下（Symfony等）の実装を確認
               - Symfonyの機能については `vendor/symfony/` を参照
            3. **EC-CUBE公式ドキュメント** - `doc4.ec-cube.net/` ディレクトリにclone済み
               - Grep/Read ツールで `doc4.ec-cube.net/` 内のMarkdownファイルを検索・参照
            4. **EC-CUBE本体のIssue/PR** (EC-CUBE/ec-cube)
               - `gh search issues --repo EC-CUBE/ec-cube "<検索キーワード>"` で関連Issue検索
               - `gh search prs --repo EC-CUBE/ec-cube "<検索キーワード>"` で関連PR検索
               - `gh issue view <番号> --repo EC-CUBE/ec-cube` で詳細確認

            回答には参照した情報ソースへのリンクを含めてください。

          # Issue/PRコメントの読み書き、GitHub検索、ファイル書き込みを許可
          claude_args: '--allowedTools "Bash(gh issue comment:*),Bash(gh issue view:*),Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh search:*),Write"'

          # デバッグ用：Claudeの出力を表示
          show_full_output: true

