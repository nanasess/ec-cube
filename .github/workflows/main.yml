name: CI/CD for EC-CUBE

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
    paths:
      - '**'
      - '!*.md'
  pull_request:
    paths:
      - '**'
      - '!*.md'
jobs:
  dockerbuild:
    with:
      event_name: ${{ github.event_name }}
    uses: ./.github/workflows/dockerbuild.yml
  phpstan:
    with:
      ref_name: ${{ github.ref_name }}
      base_ref: ${{ github.base_ref }}
      event_name: ${{ github.event_name }}
      owner: ${{ github.repository_owner }}
    needs: [ dockerbuild ]
    uses: ./.github/workflows/phpstan.yml
